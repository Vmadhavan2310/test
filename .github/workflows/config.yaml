name: Deployment Setup

on: push

jobs: 
  deploy: 
    runs-on: ubuntu-latest

    steps: 
      - name: print single line
        run: echo ${{secrets.THEME_ID}}

      - name: Check secrets
        env: 
          theme_id: 188771827987
        run: | 
          if [ "${{secrets.THEME_ID}}" == $theme_id ]; then
            echo "Theme ID Matched"
          else
            echo "not Exists"  
          fi 
