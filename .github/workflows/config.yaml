name: Shopify Theme Pipeline

on: 
  push: 
    branches-ignore:
      - main
env: 
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
  THEME_NAME: ${{ github.ref_name }}
  COLLECTION_HANDLE: "sale"
  PRODUCT_HANDLE: "stread-pro-laufband"

jobs:
  Prettier: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier Formatting
        run: npx prettier "**/*.liquid" --write 

  ES_lint: 
    runs-on: ubuntu-latest
    needs: Prettier
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run ES_lint
        run: npm run lint      

  Theme_Check: 
    runs-on: ubuntu-latest
    needs: ES_lint
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme  

      - name: Shopify theme Check
        run: npm run theme:check

  JSFileSize: 
    needs: Theme_Check
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript size
        run: |
          LIMIT=50000

          find assets -name "*.js" | while read file; do
            SIZE=$(wc -c < "$file")

            echo "$file : $SIZE"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "$file exceeds ${LIMIT} bytes"
              exit 1
            fi
          done

  Shopify_theme_push:
    runs-on: ubuntu-latest
    needs: JSFileSize
    outputs:
      current_theme_id: '${{ steps.create_theme.outputs.current_theme_id }}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme
      - name: Find theme ID by name
        id: find_theme
        run: |
          THEME_ID=$(shopify theme list --json \
            | jq -r --arg NAME "$THEME_NAME" '.[] | select(.name==$NAME) | .id' \
          )

          if [ -z "$THEME_ID" ] || [ "$THEME_ID" = "null" ]; then
            echo "Theme not found"
            echo "theme_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Theme found: $THEME_ID"
            echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          fi

          echo "Found theme id: $THEME_ID"
          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"         
      - name: Create Preview Theme
        id: create_theme
        run: |
          if [ "${{ steps.find_theme.outputs.theme_id }}" == "" ]; then
            echo "New theme Creates"
            current_theme_id=$(shopify theme push --unpublished --theme "$THEME_NAME" --json | jq -r '.theme.id') || exit 1
            echo "current_theme_id=$current_theme_id" >> "$GITHUB_OUTPUT"
          else 
            echo "Pushing to existing theme"
            current_theme_id=$(shopify theme push --theme ${{ steps.find_theme.outputs.theme_id }} --json | jq -r '.theme.id') || exit 1
            echo "test_url: $current_theme_id"
            echo "current_theme_id=$current_theme_id" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: Shopify_theme_push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      ## "https://${SHOPIFY_FLAG_STORE}/?preview_theme_id=${{ needs.Shopify_theme_push.outputs.current_theme_id }}"
      - name: Create Lighthouse config
        run: |
          cat > .lighthouserc.json <<EOF
          {
            "ci": {
              "collect": {
                "url": [
                  "https://www.sportstech.de/?preview_theme_id=${{ needs.Shopify_theme_push.outputs.current_theme_id }}",
                  "https://www.sportstech.de/products/${PRODUCT_HANDLE}/?preview_theme_id=${{ needs.Shopify_theme_push.outputs.current_theme_id }}",
                  "https://www.sportstech.de/collections/${COLLECTION_HANDLE}/?preview_theme_id=${{ needs.Shopify_theme_push.outputs.current_theme_id }}"
                ],
                "numberOfRuns": 1
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", { "minScore": 0.2 }],
                  "categories:accessibility": ["warn", { "minScore": 0.8 }],
                  "categories:best-practices": ["warn", { "minScore": 0.8 }],
                  "categories:seo": ["warn", { "minScore": 0.8 }],

                  "first-contentful-paint": ["warn", { "maxNumericValue": 3000 }],
                  "largest-contentful-paint": ["warn", { "maxNumericValue": 4000 }],
                  "speed-index": ["warn", { "maxNumericValue": 5000 }],
                  "interactive": ["warn", { "maxNumericValue": 6000 }],
                  "max-potential-fid": ["warn", { "maxNumericValue": 300 }],
                  "cumulative-layout-shift": ["warn", { "maxNumericValue": 0.25 }],
                  "total-byte-weight": ["warn", { "maxNumericValue": 3000000 }],

                  "unminified-javascript": ["warn", { "maxLength": 10 }],
                  "unused-javascript": ["warn", { "maxLength": 10 }],
                  "offscreen-images": ["warn", { "maxLength": 5 }],
                  "uses-responsive-images": ["warn", { "maxLength": 10 }]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF

          jq empty .lighthouserc.json && echo "Valid JSON" || (echo "Invalid JSON"; cat .lighthouserc.json; exit 1)

      - name: Run Lighthouse
        run: npx lhci autorun


