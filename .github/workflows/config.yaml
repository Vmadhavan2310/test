name: Shopify Theme Pipeline

on: 
  push: 
    branches-ignore:
      - main
env: 
  SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
  THEME_NAME: ${{ github.ref_name }}

jobs: 
  Prettier: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier Formatting
        run: npx prettier "**/*.liquid" --write 

  ES_lint: 
    runs-on: ubuntu-latest
    needs: Prettier
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run ES_lint
        run: npm run lint      

  Theme_Check: 
    runs-on: ubuntu-latest
    needs: ES_lint
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme  

      - name: Shopify theme Check
        run: npm run theme:check

  JSFileSize: 
    needs: Theme_Check
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript size
        run: |
          LIMIT=500000

          find assets -name "*.js" | while read file; do
            SIZE=$(wc -c < "$file")

            echo "$file : $SIZE"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "$file exceeds ${LIMIT} bytes"
              exit 1
            fi
          done

  Shopify_theme_push: 
    runs-on: ubuntu-latest
    needs: JSFileSize
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme 

      - name: Find theme ID by name
        id: find_theme
        run: |
          THEME_ID=$(shopify theme list --json \
            | jq -r --arg NAME "$THEME_NAME" '.[] | select(.name==$NAME) | .id' \
          )

          if [ -z "$THEME_ID" ] || [ "$THEME_ID" = "null" ]; then
            echo "Theme not found"
            echo "theme_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Theme found: $THEME_ID"
            echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          fi

          echo "Found theme id: $THEME_ID"
          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"         

      - name: Create Preview Theme
 
        run: |
          if [ "" == "" ]; then
            if [ "" == "" ]; then
              echo "New theme Creates"
              # Capture the output in a variable instead of a file
              OUTPUT=$(shopify theme push --unpublished --theme "$THEME_NAME" --json)
              
              # Extract only the JSON part and grab the ID
              THEME_IDs=$(echo "$OUTPUT" | grep -o '{.*}' | jq -r '.id')
              echo "Theme ID: $THEME_IDs"
            else 
              echo "Pushing to existing theme"
              shopify theme push --theme "$THEME_IDs" --json || exit 1
            fi
          fi 

  lighthouse:
    runs-on: ubuntu-latest
    needs: Shopify_theme_push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx lhci autorun

