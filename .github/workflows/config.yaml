name: Shopify Theme Pipeline

on: 
  push: 
    branches-ignore:
      - main
env: 
  SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
  THEME_NAME: ${{ github.ref_name }}

jobs: 

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      ## "https://${SHOPIFY_FLAG_STORE}/?preview_theme_id=${{ needs.Shopify_theme_push.outputs.current_theme_id }}"
      - name: Create Lighthouse config
        run: |
          cat > .lighthouserc.json <<EOF
          {
            "ci": {
              "collect": {
                "url": [
                  "https://www.sportstech.de"
                ],
                "numberOfRuns": 1
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", { "minScore": 0.5 }],
                  "categories:accessibility": ["warn", { "minScore": 0.8 }],
                  "categories:best-practices": ["warn", { "minScore": 0.8 }],
                  "categories:seo": ["warn", { "minScore": 0.8 }]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF

          jq empty .lighthouserc.json && echo "✅ Valid JSON" || (echo "❌ Invalid JSON"; cat .lighthouserc.json; exit 1)

      - name: Run Lighthouse
        run: npx lhci autorun


