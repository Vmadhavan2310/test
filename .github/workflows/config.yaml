name: Shopify Theme Pipeline

on: push

jobs: 
  ES_lint: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Install Dependencies
        uses: npm ci

      - name: Run ES_lint
        uses: npm run lint      


