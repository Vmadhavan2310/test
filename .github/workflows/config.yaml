name: Shopify Theme Pipeline

on: 
  push: 
    branches-ignore:
      - main
env: 
  SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
  THEME_NAME: ${{ github.ref_name }}

jobs: 

  Shopify_theme_push: 
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.create_theme.outputs.preview_url }}
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme 

      - name: Find theme ID by name
        id: find_theme
        run: |
          THEME_ID=$(shopify theme list --json \
            | jq -r --arg NAME "$THEME_NAME" '.[] | select(.name==$NAME) | .id' \
          )

          if [ -z "$THEME_ID" ] || [ "$THEME_ID" = "null" ]; then
            echo "Theme not found"
            echo "theme_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Theme found: $THEME_ID"
            echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          fi

          echo "Found theme id: $THEME_ID"
          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"         

      - name: Create Preview Theme
        id: create_theme
        run: |
          if [ "${{ steps.find_theme.outputs.theme_id }}" == "" ]; then
            echo "New theme Creates"
            preview_url=$(shopify theme push --unpublished --theme "$THEME_NAME" --json | jq '.theme.preview_url') || exit 1
            echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          else 
            echo "Pushing to existing theme"
            preview_url=$(shopify theme push --theme ${{ steps.find_theme.outputs.theme_id }} --json | jq '.theme.preview_url') || exit 1)
            echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    runs-on: ubuntu-latest
    needs: Shopify_theme_push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: echo "lighthouse tets ${{ needs.Shopify_theme_push.outputs.preview_url }}"


