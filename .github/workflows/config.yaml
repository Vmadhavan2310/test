name: Shopify Theme Pipeline

on:
  push:
    branches-ignore:
      - main

jobs:
  Optimized:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript size
        run: |
          LIMIT=4000

          find assets -name "*.js" | while read file; do
            SIZE=$(wc -c < "$file")

            echo "$file : $SIZE"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "$file exceeds 500 KB"
              exit 1
            fi
          done

          echo "Done"