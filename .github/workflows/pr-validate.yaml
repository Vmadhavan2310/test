name: Shopify Theme Pipeline

on: 
  pull_request: 
    branches:
      - main
env: 
  SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

jobs: 
  Prettier: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier Formatting
        run: npx prettier "**/*.liquid" --write 

  ES_lint: 
    runs-on: ubuntu-latest
    needs: Prettier
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run ES_lint
        run: npm run lint      

  Theme_Check: 
    runs-on: ubuntu-latest
    needs: ES_lint
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme  

      - name: Shopify theme Check
        run: npm run theme:check

  JSFileSize: 
    needs: Theme_Check
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript size
        run: |
          LIMIT=500000

          find assets -name "*.js" | while read file; do
            SIZE=$(wc -c < "$file")

            echo "$file : $SIZE"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "$file exceeds ${LIMIT} bytes"
              exit 1
            fi
          done

  lighthouse:
    runs-on: ubuntu-latest
    needs: Shopify_theme_push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx lhci autorun      
 



